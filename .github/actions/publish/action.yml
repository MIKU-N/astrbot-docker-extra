name: 合并架构清单并发布
description: 把两个架构的 digest 合并为多架构清单，推送到 GHCR，并按需同步到 Docker Hub

inputs:
  image_name:
    description: GHCR 镜像名
    required: true
  tags:
    description: 需要发布的标签列表（逗号分隔）
    required: true
  digest_amd64:
    description: amd64 架构镜像 digest
    required: true
  digest_arm64:
    description: arm64 架构镜像 digest
    required: true
  github_token:
    description: 登录 GHCR 用的 GITHUB_TOKEN
    required: false
    default: ''
  dockerhub_username:
    description: Docker Hub 用户名；留空则跳过 Docker Hub 同步
    required: false
    default: ''
  dockerhub_token:
    description: Docker Hub Access Token
    required: false
    default: ''
  dockerhub_repo:
    description: Docker Hub 仓库名；留空则取当前仓库名
    required: false
    default: ''

outputs:
  primary:
    description: 主标签完整引用
    value: ${{ steps.manifest.outputs.primary }}

runs:
  using: composite
  steps:
    - name: 登录 GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: 登录 Docker Hub
      if: inputs.dockerhub_username != ''
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: 启用 Buildx
      uses: docker/setup-buildx-action@v3

    # 两个架构各自构建、各自冒烟通过后，才在这里合成多架构清单并打标签，
    # 因此任何架构失败都不会产生可见的可用标签
    - name: 合并双架构清单
      id: manifest
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image_name }}
        TAGS: ${{ inputs.tags }}
        DIGEST_AMD64: ${{ inputs.digest_amd64 }}
        DIGEST_ARM64: ${{ inputs.digest_arm64 }}
      run: |
        set -euo pipefail
        args=()
        IFS=',' read -ra TAG_LIST <<< "$TAGS"
        for t in "${TAG_LIST[@]}"; do
          args+=(--tag "$t")
        done
        docker buildx imagetools create \
          --annotation "index:org.opencontainers.image.title=AstrBot Extended" \
          --annotation "index:org.opencontainers.image.description=AstrBot with extra Python dependencies (faiss/numpy/pandas/scikit-learn/lightrag/mem0)" \
          --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
          --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
          --annotation "index:org.opencontainers.image.licenses=AGPL-3.0" \
          "${args[@]}" \
          "$IMAGE_NAME@$DIGEST_AMD64" \
          "$IMAGE_NAME@$DIGEST_ARM64"
        echo "primary=${TAG_LIST[0]}" >> "$GITHUB_OUTPUT"

    - name: 同步镜像清单到 Docker Hub
      id: hub
      if: inputs.dockerhub_username != ''
      shell: bash
      env:
        TAGS: ${{ inputs.tags }}
        DOCKERHUB_USERNAME: ${{ inputs.dockerhub_username }}
        DOCKERHUB_REPO: ${{ inputs.dockerhub_repo }}
      run: |
        set -euo pipefail
        repo="$DOCKERHUB_REPO"
        if [ -z "$repo" ]; then
          repo="${GITHUB_REPOSITORY##*/}"
        fi
        hub_name="$(echo "$DOCKERHUB_USERNAME/$repo" | tr '[:upper:]' '[:lower:]')"
        hub_image="docker.io/$hub_name"

        args=()
        IFS=',' read -ra TAG_LIST <<< "$TAGS"
        for t in "${TAG_LIST[@]}"; do
          args+=(--tag "$hub_image:${t##*:}")
        done
        # 复用 GHCR 已推送的 manifest list，避免二次构建
        docker buildx imagetools create "${args[@]}" "${TAG_LIST[0]}"
        echo "primary=$hub_image:${TAG_LIST[0]##*:}" >> "$GITHUB_OUTPUT"

    - name: 校验镜像清单
      shell: bash
      env:
        PRIMARY: ${{ steps.manifest.outputs.primary }}
        HUB_PRIMARY: ${{ steps.hub.outputs.primary }}
        DOCKERHUB_USERNAME: ${{ inputs.dockerhub_username }}
      run: |
        set -euo pipefail
        echo "--- GHCR ---"
        docker buildx imagetools inspect "$PRIMARY"
        if [ -n "$DOCKERHUB_USERNAME" ]; then
          echo "--- Docker Hub ---"
          docker buildx imagetools inspect "$HUB_PRIMARY"
        fi
